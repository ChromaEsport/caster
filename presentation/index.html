<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chroma Esport — Player Intro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" aria-live="polite">
    <div class="background-grid"></div>
    <div class="background-shape"></div>
    <div class="side-rail"><span>CHROMA ESPORT</span><i></i><b>OVERWATCH</b></div>

    <header class="header">
      <img class="logo" src="../logo/chroma%20badge.png" alt="Logo Chroma Esport">
      <div class="header-rule"></div>
      <div class="header-label"><span>CHROMA ESPORT</span><strong>PLAYER SPOTLIGHT</strong></div>
      <div class="header-index"><span>ROSTER</span><b> / 2026</b></div>
    </header>

    <section class="content">
      <div class="player-info">
        <div class="overline"><span class="pulse"></span><span id="playerTag">CHROMA OVERWATCH</span></div>
        <h1 id="playerName">JK</h1>
        <div class="role-line"><span class="role-bar"></span><strong id="playerRole">TANK MAIN</strong></div>

        <div class="team-card">
          <div class="team-icon"><span></span><span></span><span></span></div>
          <div class="team-copy"><small>OFFICIAL TEAM</small><strong id="playerTeam">CHROMA OVERWATCH</strong></div>
        </div>
        <div class="name-decoration">PLAYER<br><em>PROFILE</em></div>
      </div>

      <div class="character-panel">
        <div class="character-frame"></div>
        <div class="character-glow"></div>
        <div class="character-number" id="heroNumber">01</div>
        <div class="character-image" id="heroFigure">
          <img id="heroPortrait" src="https://static.wikia.nocookie.net/overwatch_gamepedia/images/2/27/OW2_Reinhardt.png/revision/latest?cb=20220409014723" alt="Reinhardt">
        </div>
        <div class="character-name"><span>PLAYER'S SIGNATURE HERO</span><strong id="heroName">REINHARDT</strong></div>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-slogan">NEVER BACK DOWN<span>.</span></div>
      <div class="footer-line"></div>
      <div class="footer-caption">BUILT TO COMPETE <b>•</b> UNITED AS ONE</div>
    </footer>
    <div class="corner corner-tl"></div><div class="corner corner-br"></div>
  </main>
  <script src="players.js"></script>
  <script src="script.js"></script>
</body>
</html>
