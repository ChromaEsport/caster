
<!DOCTYPE html>
<html lang="fr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chroma Esport — Player Presentation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="stage" aria-live="polite">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="../logo/chroma%20badge.png" alt="Logo Chroma Esport">
        <div class="brand-name"><strong>CHROMA</strong><b>ESPORT</b></div>
      </div>
      <div class="event-label"><span>PLAYER PRESENTATION</span><b>/ OVERWATCH</b></div>
      <div class="top-line"></div>
    </header>

    <section class="profile">
      <div class="section-kicker"><i></i> PLAYER PROFILE</div>
      <div class="identity">
        <div class="identity-copy">
          <div class="eyebrow" id="playerTag">CHROMA OVERWATCH</div>
          <h1 id="playerName">JK</h1>
          <div class="role"><span class="role-diamond"></span><span id="playerRole">TANK MAIN</span></div>
          <div class="accent-line"></div>
          <div class="details">
            <article class="detail"><span>ÉQUIPE</span><strong id="playerTeam">CHROMA OVERWATCH</strong></article>
          </div>
        </div>
        <div class="hero-zone">
          <div class="hero-orbit"></div>
          <div class="hero-number" id="heroNumber">01</div>
          <div class="hero-figure" id="heroFigure"><img id="heroPortrait" src="https://static.wikia.nocookie.net/overwatch_gamepedia/images/2/27/OW2_Reinhardt.png/revision/latest?cb=20220409014723" alt="Reinhardt"></div>
          <div class="hero-caption"><span>MAIN HERO</span><strong id="heroName">REINHARDT</strong></div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="motto">NEVER BACK<br>DOWN<span>.</span></div>
      <div class="footer-meta"><span>CHROMA ESPORT</span><i></i><span>OVERWATCH DIVISION</span></div>
    </footer>
    <div class="scanline"></div>
  </main>
  <script src="players.js"></script>
  <script src="script.js"></script>
</body>
</html>
