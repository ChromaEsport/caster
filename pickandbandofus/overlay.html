<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma Esport - Pick & Ban</title>
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <main class="draft-overlay">

    <section class="battlefield">
        <div class="team team-a">
            <div class="team-heading">
                <span class="team-letter">A</span>
                <div>
                    <h2 id="teamAName">ÉQUIPE A</h2>
                    <p>ÉQUIPE BLEUE</p>
                </div>
            </div>
            <div class="players" id="playersA"></div>
        </div>

        <div class="map-panel">
            
            <div class="map-art" id="mapArt">
                <div class="map-name" id="mapName">EN ATTENTE</div>
            </div>
            
        </div>

        <div class="team team-b">
            <div class="team-heading">
                <div>
                    <h2 id="teamBName">ÉQUIPE B</h2>
                    <p>ÉQUIPE ROUGE</p>
                </div>
                <span class="team-letter">B</span>
            </div>
            <div class="players" id="playersB"></div>
        </div>
    </section>

    <section class="timeline-section">
        <div class="section-heading">
            <h3>CHRONOLOGIE DU DRAFT</h3>
            <span id="actionCount">0 ACTION</span>
        </div>
        <div class="timeline" id="timeline">
            <div class="timeline-empty">Les actions de pick et ban apparaîtront ici.</div>
        </div>
    </section>

    <section class="classes-section">
    <div class="classes-title">
        <div class="classes-title-accent"></div>
        <div class="classes-title-content">
            <h2>PICK <span>&</span> BAN</h2>
            <p id="eventName">CHROMA ESPORT</p>
        </div>
    </div>

    <div class="class-list" id="classList"></div>
</section>

</main>
<script type="module" src="./overlay.js"></script>


</body>
</html>
