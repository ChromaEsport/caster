
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chroma Esport - Casters & Événement</title>

<style>
:root {
    --chroma-dark: #010c2c;
    --chroma-blue: #3c9195;
    --chroma-gold: #c89c4d;
    --chroma-dragon: #8fecc9;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    font-family: "Barlow Condensed", Arial, sans-serif;
}

#eventBanner {
    position: absolute;
    top: auto;
    bottom:90px;
    left: 50%;
    z-index: 100;

    width: 280px;
    padding: 3px;

    transform: translate(-50%, 220px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    border-radius: 7px;

    background: linear-gradient(
        110deg,
        var(--chroma-blue),
        var(--chroma-gold),
        var(--chroma-dragon)
    );

    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);

    transition:
        transform 0.8s ease,
        opacity 0.8s ease,
        visibility 0s linear 0.8s;
}

#eventBanner.visible {
    transform: translate(-50%, 0);
    opacity: 1;
    visibility: visible;

    transition:
        transform 0.8s ease,
        opacity 0.8s ease,
        visibility 0s;
}

.banner-content {
    padding: 5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    background: rgba(1, 12, 44, 0.97);
    border-radius: 5px;
}

.brand {
    color: var(--chroma-dragon);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 5px;
}

#eventName {
    margin-top: 5px;
    margin-bottom:5px;
    color: white;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    overflow-wrap: anywhere;
}

.casters-row {
    display: grid;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 9px;
    color: white;
    font-size: 22px;
    font-weight: 700;
}

.casters-label {
    color: var(--chroma-gold);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 2px;
}

#casterNames {
    color: white;
    text-transform: uppercase;
}

#connectionStatus {
    position: absolute;
    left: 10px;
    bottom: 10px;
    color: transparent;
    font-size: 1px;
}
</style>
</head>

<body>

<div id="eventBanner">
    <div class="banner-content">
        <div class="casters-row">
            <span id="casterNames">Chargement…</span>
        </div>
        
        <div id="eventName">Chargement de l'événement…</div>
    </div>
</div>

<div id="connectionStatus">Connexion Firebase…</div>

<script type="module">
import {
    db,
    doc,
    onSnapshot
} from "../pickandbandofus/dofus-firebase.js";

/*
 * Fichier indépendant de l'overlay principal.
 * Lecture en temps réel de dofusMatches/current.
 */

const matchRef = doc(db, "dofusMatches", "current");

const eventNameElement = document.getElementById("eventName");
const casterNamesElement = document.getElementById("casterNames");
const banner = document.getElementById("eventBanner");
const statusElement = document.getElementById("connectionStatus");

const VISIBLE_DURATION = 8000;
const CYCLE_DURATION = 30000;

let bannerTimer = null;
let cycleTimer = null;
let firstSnapshotReceived = false;


function updateBanner(data) {
    const eventName = String(data.eventName || "").trim();
    const caster1 = String(data.caster1 || "").trim();
    const caster2 = String(data.caster2 || "").trim();

    // 🎮 Nom de l'événement
    eventNameElement.textContent = eventName
        ? "🏆 " + eventName
        : "🏆 ÉVÉNEMENT À VENIR";

    // 🎙️ Noms des casters
    const casters = [caster1, caster2].filter(Boolean);

    casterNamesElement.textContent = casters.length
        ? "🎙️ " + casters.join("  &  ")
        : "🎙️ CASTERS À VENIR";
}


function showBanner() {
    banner.classList.add("visible");

    clearTimeout(bannerTimer);

    bannerTimer = setTimeout(() => {
        banner.classList.remove("visible");
    }, VISIBLE_DURATION);
}

function startLoop() {
    if (cycleTimer !== null) return;

    showBanner();

    cycleTimer = setInterval(() => {
        showBanner();
    }, CYCLE_DURATION);
}

onSnapshot(
    matchRef,
    snapshot => {
        if (!snapshot.exists()) {
            statusElement.textContent = "Document Firebase introuvable";
            updateBanner({});
            return;
        }

        updateBanner(snapshot.data());
        statusElement.textContent = "Connecté à Firebase";

        // Démarre l'animation à la première réception des données.
        if (!firstSnapshotReceived) {
            firstSnapshotReceived = true;
            startLoop();
        }
    },
    error => {
        console.error("Erreur Firebase Casters & Événement :", error);
        statusElement.textContent = "Erreur Firebase";
    }
);
</script>

</body>
</html>
