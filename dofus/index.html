<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Chroma Esport — Dofus Overlay</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<div class="dofus-header">

   
<!-- ÉQUIPE A -->
<div class="team-blockA team-left">
    <span class="team-letterA">A</span>
    <div class="team-content">
        <div id="teamA">EQUIPE A</div>
        <div id="playersA" class="chroma-players"></div>
    </div>
</div>

<!-- SCORE A -->
<div class="score-blockA score-left">
    <span id="scoreA">0</span>
</div>

<!-- DOFUS ET MAP -->
<div class="dofus-block">
    <img
        id="dofusLogo"
        src="dofus.png"
        alt="DOFUS"
    >

    <div id="mapDisplay" class="map-display">
        <span id="mapName">MAP EN ATTENTE</span>
        <img id="mapImage" src="" alt="Map Dofus" hidden>
    </div>
</div>

<!-- SCORE B -->
<div class="score-blockB score-right">
    <span id="scoreB">0</span>
</div>

<!-- ÉQUIPE B -->
<div class="team-blockB team-right">
    <div class="team-content">
        <div id="teamB">EQUIPE B</div>
        <div id="playersB" class="chroma-players"></div>
    </div>
    <span class="team-letterB">B</span>
</div>


</div>

<script type="module" src="script.js"></script>


</body>
</html>
