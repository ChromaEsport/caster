<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Chroma Esport — Dofus Overlay</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<div class="dofus-header">

    <!-- ÉQUIPE 1 -->
    <div class="team-block team-left">
        <span id="teamA">CHROMA ESPORT</span>
    </div>

    <!-- SCORE 1 -->
    <div class="score-block score-left">
        <span id="scoreA">0</span>
    </div>

    <!-- DOFUS -->
    <div class="dofus-block">
        <img
            id="dofusLogo"
            src="dofus.png"
            alt="DOFUS"
        >
    </div>

    <!-- SCORE 2 -->
    <div class="score-block score-right">
        <span id="scoreB">0</span>
    </div>

    <!-- ÉQUIPE 2 -->
    <div class="team-block team-right">
        <span id="teamB">ADVERSAIRE</span>
    </div>

</div>

<script type="module" src="script.js"></script>


</body>
</html>
