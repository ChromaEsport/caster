<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chroma Esport - Overlay Overwatch HUD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:ital,wght@0,700;1,700&display=swap');

    :root {
      --white: #FFFFFF;
      --chroma-accent: #8FECC9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    /* Conteneur principal ancré en bas de l'écran */
    .overlay-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 1350px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Image de fond (votre PNG) */
    .banner-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: auto;
      z-index: 1;
      pointer-events: none;
    }

    /* Calque pour le texte et les icônes */
    .hud-content {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 52px;
      z-index: 2;
      display: flex;
      align-items: center;
    }

    /* --- CENTRE : ICÔNE + NOM DU RÔLE --- */
    .role-section {
      position: absolute;
      left: 50%;
      top: -45px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100px;
      z-index: 3;
    }

    .role-icon {
      width: 100px;
      height: 50px;
      fill: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
    }

    .role-icon svg {
      width: 100%;
      height: 100%;
      fill: var(--white);
    }

    .role-name {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-style: italic;
      font-size: 20px;
      color: var(--white);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 1px;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      position: relative;
      top:-5px;
     
    }

    /* --- DROITE : PSEUDO DU JOUEUR --- */
    .player-section {
      position: absolute;
      left: 1030px;
      bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      top:-30px;
    }

    .player-name {
      font-family: 'Teko', sans-serif;
      font-size: 34px;
      line-height: 28px;
      font-weight: 700;
      color: var(--white);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5), 0 0 3px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <!-- Image de fond du bandeau -->
    <img src="Banniere_eSport_neon_futuriste.png" alt="Bannière Chroma" class="banner-bg">

    <div class="hud-content">
      <!-- AU MILIEU : Icône + Rôle -->
      <div class="role-section">
        <div class="role-icon" id="roleIcon"></div>
        <div class="role-name" id="roleName">TANK</div>
      </div>

      <!-- À DROITE : Pseudo du joueur -->
      <div class="player-section">
        <div class="player-name" id="playerName">BEAM</div>
      </div>
    </div>
  </div>

  <script>
    // SVG des icônes Overwatch 2
    const rolesSVG = {
      tank: `<svg viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3z"/></svg>`,
      dps: `<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8H7z"/></svg>`,
      damage: `<svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8H7z"/></svg>`,
      support: `<svg viewBox="0 0 24 24"><path d="M19 10.5h-5.5V5h-3v5.5H5v3h5.5V19h3v-5.5H19v-3z"/></svg>`
    };

    const roleLabels = {
      tank: 'TANK',
      dps: 'DAMAGE',
      damage: 'DAMAGE',
      support: 'SUPPORT'
    };

    // Lecture des variables dynamiques dans l'URL (?pseudo=...&role=...)
    const params = new URLSearchParams(window.location.search);
    const pseudo = params.get('pseudo') || 'BEAM';
    const roleKey = (params.get('role') || 'tank').toLowerCase();

    // Injection dans le DOM
    document.getElementById('playerName').textContent = pseudo;
    document.getElementById('roleName').textContent = roleLabels[roleKey] || 'TANK';
    document.getElementById('roleIcon').innerHTML = rolesSVG[roleKey] || rolesSVG['tank'];
  </script>
</body>
</html>
