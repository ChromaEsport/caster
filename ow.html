<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@600&family=Rajdhani:wght@700&display=swap');

    :root {
      --chroma-dark: #010C2C;
      --chroma-primary: #3C9195;
      --chroma-accent: #8FECC9;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; font-family: 'Rajdhani', sans-serif; overflow: hidden; width: 1920px; height: 1080px; position: relative; }

    .player-card {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      background: rgba(1, 12, 44, 0.88);
      border-bottom: 2px solid var(--chroma-accent);
      border-radius: 4px;
      padding: 4px 14px 4px 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .player-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: linear-gradient(180deg, var(--chroma-accent), var(--chroma-primary));
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
    }

    .logo-container { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; margin-right: 10px; }
    .logo-container img { max-width: 100%; max-height: 100%; filter: drop-shadow(0 0 4px var(--chroma-primary)); }

    .divider { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.15); margin-right: 10px; }

    .role-icon { width: 18px; height: 18px; margin-right: 8px; fill: var(--chroma-accent); display: flex; align-items: center; }

    .player-info { display: flex; flex-direction: column; justify-content: center; }
    .player-name { font-family: 'Teko', sans-serif; font-size: 24px; line-height: 20px; font-weight: 600; color: var(--white); text-transform: uppercase; letter-spacing: 1px; }
    .player-details { font-size: 11px; line-height: 11px; color: var(--chroma-accent); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
    .role-tag { color: rgba(255, 255, 255, 0.6); font-weight: 500; }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="logo-container">
      <img src="logo_chroma.png" alt="Chroma Esport">
    </div>
    <div class="divider"></div>
    <div class="role-icon" id="roleIcon"></div>
    <div class="player-info">
      <div class="player-name" id="playerName">PLAYER</div>
      <div class="player-details">
        <span class="role-tag" id="roleTag">FLEX</span> • CHROMA ESPORT
      </div>
    </div>
  </div>

  <script>
    // Dictionnaire des SVG des rôles OW2
    const rolesSVG = {
      tank: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3z"/></svg>`,
      dps: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8H7z"/></svg>`,
      damage: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8H7z"/></svg>`,
      support: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 10.5h-5.5V5h-3v5.5H5v3h5.5V19h3v-5.5H19v-3z"/></svg>`
    };

    // Extraction des parametres d'URL
    const params = new URLSearchParams(window.location.search);
    const pseudo = params.get('pseudo') || 'JOUEUR';
    const role = (params.get('role') || 'dps').toLowerCase();

    // Injection dans le DOM
    document.getElementById('playerName').textContent = pseudo;
    document.getElementById('roleTag').textContent = role.toUpperCase();
    document.getElementById('roleIcon').innerHTML = rolesSVG[role] || rolesSVG['dps'];
  </script>
</body>
</html>
