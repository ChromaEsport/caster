<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHROMA ESPORT - Player Intro</title>
  <link rel="stylesheet" href="presentation.css">
</head>
<body>
  <main id="intro" class="intro">
    <div class="background-glow"></div>
    <div class="grid-lines"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">C</span>
        <span>CHROMA <b>ESPORT</b></span>
      </div>
      <div class="event">PLAYER PRESENTATION <span> / </span> OVERWATCH</div>
    </header>

    <section class="player-layout">
      <div class="player-info">
        <div class="eyebrow">
          <span class="live-dot"></span>
          PLAYER PROFILE
        </div>

        <div class="player-number" id="player-number">PLAYER 01</div>
        <h1 id="player-name">JK</h1>

        <div class="role-line">
          <span class="role-icon">◆</span>
          <span id="player-role">TANK MAIN</span>
        </div>

        <div class="gold-line"></div>

        <div class="details">
          <div class="detail">
            <span class="detail-label">ÉQUIPE</span>
            <strong id="player-team">CHROMA OVERWATCH</strong>
          </div>
          <div class="detail">
            <span class="detail-label">STATUT</span>
            <strong id="player-status">CAPITAINE</strong>
          </div>
          <div class="detail">
            <span class="detail-label">RESPONSABILITÉ</span>
            <strong id="player-responsibility">MANAGER DES ÉQUIPES OVERWATCH</strong>
          </div>
        </div>

        <div class="player-quote">
          NEVER BACK DOWN<span>.</span>
        </div>
      </div>

      <div class="hero-area">
        <div class="hero-ring ring-one"></div>
        <div class="hero-ring ring-two"></div>
        <div class="hero-light"></div>

        <!-- Illustration originale : chevalier futuriste -->
        <svg class="hero-art" viewBox="0 0 600 800"
             xmlns="http://www.w3.org/2000/svg" role="img"
             aria-label="Chevalier futuriste en armure">
          <defs>
            <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f1f5f6"/>
              <stop offset=".35" stop-color="#8299a4"/>
              <stop offset=".7" stop-color="#344c5e"/>
              <stop offset="1" stop-color="#101e31"/>
            </linearGradient>
            <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8fecc9"/>
              <stop offset="1" stop-color="#168b9d"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="9" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- Cape -->
          <path d="M170 265 L95 740 L390 800 L440 330 Z"
                fill="#071529" stroke="#3c9195" stroke-width="5"/>

          <!-- Body -->
          <path d="M185 260 L300 215 L420 270 L475 580
                   L390 700 L170 675 L110 480 Z"
                fill="url(#armor)" stroke="#8fa9b1" stroke-width="7"/>

          <!-- Chest armor -->
          <path d="M200 280 L300 235 L400 285 L370 445
                   L300 500 L220 440 Z"
                fill="#182c40" stroke="#c1d2d5" stroke-width="5"/>

          <path d="M245 310 L300 285 L355 310 L340 400
                   L300 435 L260 400 Z"
                fill="#244c5c" stroke="#3c9195" stroke-width="5"/>

          <path d="M300 325 L300 405" stroke="url(#blue)"
                stroke-width="10" filter="url(#glow)"/>

          <!-- Shoulder armor -->
          <path d="M180 270 L95 290 L65 390 L155 425
                   L220 350 Z"
                fill="url(#armor)" stroke="#c4d1d3" stroke-width="7"/>
          <path d="M420 275 L505 295 L535 395 L445 425
                   L380 350 Z"
                fill="url(#armor)" stroke="#c4d1d3" stroke-width="7"/>

          <!-- Helmet -->
          <path d="M215 100 L240 40 L360 40 L390 105
                   L370 220 L300 260 L230 220 Z"
                fill="url(#armor)" stroke="#dce8e9" stroke-width="8"/>

          <path d="M240 125 L300 105 L360 125 L345 175
                   L300 195 L255 175 Z"
                fill="#071629" stroke="#3c9195" stroke-width="5"/>

          <path d="M260 150 L300 140 L340 150"
                stroke="#8fecc9" stroke-width="9"
                filter="url(#glow)" fill="none"/>

          <!-- Helmet crest -->
          <path d="M300 40 L300 0 L270 45 M300 0 L330 45"
                fill="none" stroke="#c89c4d" stroke-width="9"/>

          <!-- Hammer -->
          <path d="M480 280 L555 700" stroke="#899da6" stroke-width="22"/>
          <path d="M435 215 L565 215 L580 325 L420 325 Z"
                fill="#263e53" stroke="#8fecc9" stroke-width="7"/>
          <path d="M450 270 L550 270"
                stroke="#8fecc9" stroke-width="9" filter="url(#glow)"/>

          <!-- Arms -->
          <path d="M125 390 L65 530 L135 590 L205 430"
                fill="url(#armor)" stroke="#aebfc5" stroke-width="7"/>
          <path d="M460 390 L500 500 L450 570 L395 430"
                fill="url(#armor)" stroke="#aebfc5" stroke-width="7"/>

          <!-- Energy particles -->
          <circle cx="80" cy="180" r="5" fill="#8fecc9"/>
          <circle cx="520" cy="130" r="7" fill="#c89c4d"/>
          <circle cx="90" cy="610" r="4" fill="#8fecc9"/>
          <circle cx="500" cy="610" r="5" fill="#8fecc9"/>
        </svg>

        <div class="hero-caption">CHROMA WARRIOR</div>
      </div>
    </section>

    <footer class="footer">
      <span>CHROMA ESPORT</span>
      <span>NEVER BACK DOWN</span>
      <span id="player-footer">JK // TANK </span> 
    </footer>
  </main>

  <script src="presentation.js"></script>
</body>
</html>
