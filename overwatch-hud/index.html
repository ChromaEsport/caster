<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHROMA · Overwatch HUD</title>
<style>
:root{--navy:#010c2c;--teal:#3c9195;--mint:#8fecc9;--gold:#c89c4d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#hud{position:relative;width:1920px;height:1080px;transform-origin:top left;overflow:hidden;pointer-events:none}
.frame{
 position:absolute;isolation:isolate;
 background:linear-gradient(145deg,rgba(1,12,44,.58),rgba(1,12,44,.16) 48%,rgba(1,12,44,.48));
 border:1px solid rgba(143,236,201,.76);
 filter:drop-shadow(0 0 5px rgba(60,145,149,.48)) drop-shadow(0 0 15px rgba(1,12,44,.55));
}
.frame:before{content:"";position:absolute;inset:4px;border:1px solid rgba(143,236,201,.25);pointer-events:none}
.frame:after{content:"";position:absolute;top:-1px;left:15px;width:48px;height:3px;background:var(--mint);box-shadow:0 0 7px var(--mint),0 0 16px rgba(60,145,149,.8)}
.frame .tick{position:absolute;height:2px;background:var(--mint);opacity:.9;box-shadow:0 0 8px rgba(143,236,201,.8)}
.frame .guide{display:none;position:absolute;z-index:5;color:var(--mint);font:800 10px/1 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 5px #010c2c}
.guide b{display:block;font-size:12px;color:white;margin-top:5px;letter-spacing:1px}
body.show-guide .guide{display:block}
/* HERO PORTRAIT — layered shield with a bright upper edge */
.portrait{left:25px;bottom:22px;width:151px;height:151px;clip-path:polygon(0 0,82% 0,100% 18%,100% 100%,16% 100%,0 84%);background:linear-gradient(135deg,rgba(143,236,201,.9),rgba(60,145,149,.32) 24%,rgba(1,12,44,.88) 70%)}
.portrait:before{inset:2px;background:linear-gradient(145deg,rgba(1,12,44,.88),rgba(1,12,44,.35));border:1px solid rgba(143,236,201,.35)}
.portrait:after{left:12px;top:0;width:55px;height:3px}
.portrait .tick{width:34px;right:10px;bottom:11px}
/* HEALTH — long aerodynamic rail, chamfered right edge */
.health{left:184px;bottom:31px;width:426px;height:91px;clip-path:polygon(0 0,94% 0,100% 23%,100% 100%,5% 100%,0 78%);background:linear-gradient(100deg,rgba(60,145,149,.5),rgba(1,12,44,.82) 23%,rgba(1,12,44,.52))}
.health:before{inset:4px;clip-path:polygon(0 0,94% 0,100% 23%,100% 100%,5% 100%,0 78%);border:1px solid rgba(143,236,201,.34)}
.health:after{left:20px;width:80px}
.health .tick{width:42px;right:17px;bottom:11px}
/* ABILITIES — segmented broadcast plate */
.abilities{left:700px;bottom:21px;width:408px;height:112px;clip-path:polygon(0 16%,7% 0,93% 0,100% 16%,100% 100%,0 100%);background:linear-gradient(180deg,rgba(60,145,149,.4),rgba(1,12,44,.78) 30%,rgba(1,12,44,.58))}
.abilities:before{inset:4px;clip-path:polygon(0 16%,7% 0,93% 0,100% 16%,100% 100%,0 100%);border:1px solid rgba(143,236,201,.3)}
.abilities:after{left:50%;transform:translateX(-50%);width:70px}
.abilities .tick{width:32px;right:15px;bottom:11px}
/* ULTIMATE — gold-highlighted focal module */
.ultimate{left:1120px;bottom:24px;width:164px;height:118px;clip-path:polygon(0 18%,18% 0,82% 0,100% 18%,100% 100%,0 100%);background:linear-gradient(180deg,rgba(200,156,77,.32),rgba(1,12,44,.86) 38%,rgba(1,12,44,.62))}
.ultimate:before{inset:4px;clip-path:polygon(0 18%,18% 0,82% 0,100% 18%,100% 100%,0 100%);border:1px solid rgba(200,156,77,.48)}
.ultimate:after{left:50%;transform:translateX(-50%);width:52px;background:var(--gold);box-shadow:0 0 8px var(--gold),0 0 18px rgba(200,156,77,.5)}
.ultimate .tick{width:22px;right:12px;bottom:11px;background:var(--gold);box-shadow:0 0 8px rgba(200,156,77,.8)}
/* AMMO — mirrored plate with gold micro accent */
.ammo{right:27px;bottom:27px;width:213px;height:96px;clip-path:polygon(0 0,88% 0,100% 18%,100% 100%,0 100%);background:linear-gradient(225deg,rgba(200,156,77,.22),rgba(1,12,44,.82) 35%,rgba(1,12,44,.55))}
.ammo:before{inset:4px;clip-path:polygon(0 0,88% 0,100% 18%,100% 100%,0 100%);border:1px solid rgba(143,236,201,.3)}
.ammo:after{left:auto;right:15px;width:52px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ammo .tick{width:30px;left:13px;bottom:11px;background:var(--gold);box-shadow:0 0 8px rgba(200,156,77,.75)}
/* Fine broadcast details: small edge cuts, notches and light rails */
.portrait:after,.health:after,.abilities:after,.ultimate:after,.ammo:after{height:3px}
.health{border-right:2px solid rgba(143,236,201,.8)}
.abilities{border-top:2px solid rgba(143,236,201,.72)}
.portrait{border-left:2px solid rgba(143,236,201,.92)}
.ultimate{border-top:2px solid rgba(200,156,77,.88)}
.ammo{border-right:2px solid rgba(200,156,77,.8)}
@media(prefers-reduced-motion:no-preference){
 .frame{animation:frameIn .7s ease-out both}
 @keyframes frameIn{from{opacity:0;filter:brightness(1.8) drop-shadow(0 0 18px rgba(143,236,201,.7))}to{opacity:1}}
}
</style>
</head>
<body>
<main id="hud" aria-label="Habillage HUD Overwatch Chroma">
  <section class="frame portrait"><i class="tick"></i><span class="guide">Héros<b>Portrait</b></span></section>
  <section class="frame health"><i class="tick"></i><span class="guide">Vitalité<b>Vie / armure</b></span></section>
  <section class="frame abilities"><i class="tick"></i><span class="guide">Actions<b>Compétences</b></span></section>
  <section class="frame ultimate"><i class="tick"></i><span class="guide">Ultime<b>Charge</b></span></section>
  <section class="frame ammo"><i class="tick"></i><span class="guide">Arme<b>Munitions</b></span></section>
</main>
<script>
if(new URLSearchParams(location.search).has('guide'))document.body.classList.add('show-guide');
const stage=document.getElementById('hud');
function fitStage(){stage.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
addEventListener('resize',fitStage);fitStage();
</script>
</body>
</html>
