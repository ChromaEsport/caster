
<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chroma Esport — Espace joueur</title><link rel="stylesheet" href="style.css?v=20261121hero"></head>
<body class="control-page"><main class="panel">
<header class="panel-head"><img src="../logo/logochroma.png" alt="Chroma Esport"><div><span class="kicker">CHROMA OVERWATCH</span><h1>Espace joueur</h1><p>Configure ton identification personnelle sur le stream.</p></div></header>
<section class="editor">
<label for="player-id">Ton identifiant personnel</label><input id="player-id" maxlength="24" placeholder="Ex. jk" autocomplete="off">
<p class="hint">Garde le même identifiant à chaque utilisation. Il doit être unique et fourni par l'équipe Chroma.</p>
<label for="pseudo">Ton pseudo affiché</label><input id="pseudo" maxlength="18" placeholder="Ex. JK" autocomplete="off">
<label for="design">Style du bandeau</label><select id="design"><option value="broadcast">Chroma Broadcast — Angulaire</option><option value="strike">Chroma Strike — Impact</option><option value="minimal">Chroma Minimal — Épuré</option><option value="neon">Bannière eSport — Néon futuriste</option></select>
<label for="hero">Ton héros principal</label><select id="hero"><option value="">Aucun héros sélectionné</option><option value="Ana.png">Ana</option><option value="Ange.png">Ange</option><option value="Anran.png">Anran</option><option value="Ashe.png">Ashe</option><option value="Baptiste.png">Baptiste</option><option value="Bastion.png">Bastion</option><option value="Bouldozer.png">Bouldozer</option><option value="Brigitte.png">Brigitte</option><option value="Cassidy.png">Cassidy</option><option value="Chacal.png">Chacal</option><option value="Chopper.png">Chopper</option><option value="D.Mon.png">D.Mon</option><option value="D.Va.png">D.Va</option><option value="Danger.png">Danger</option><option value="Doctrine.png">Doctrine</option><option value="Domina.png">Domina</option><option value="Doomfist.png">Doomfist</option><option value="Echo.png">Echo</option><option value="Emre.png">Emre</option><option value="Fatale.png">Fatale</option><option value="Faucheur.png">Faucheur</option><option value="Freja.png">Freja</option><option value="Genji.png">Genji</option><option value="Hanzo.png">Hanzo</option><option value="Illari.png">Illari</option><option value="Jetpack Cat.png">Jetpack Cat</option><option value="Juno.png">Juno</option><option value="Kiriko.png">Kiriko</option><option value="Lúcio.png">Lúcio</option><option value="Mauga.png">Mauga</option><option value="Mei.png">Mei</option><option value="Mizuki.png">Mizuki</option><option value="Moira.png">Moira</option><option value="Orisa.png">Orisa</option><option value="Pharah.png">Pharah</option><option value="Ramattra.png">Ramattra</option><option value="Reine des Junkers.png">Reine des Junkers</option><option value="Reinhardt.png">Reinhardt</option><option value="Shion.png">Shion</option><option value="Sierra.png">Sierra</option><option value="Sigma.png">Sigma</option><option value="Sojourn.png">Sojourn</option><option value="Soldat 76.png">Soldat 76</option><option value="Sombra.png">Sombra</option><option value="Symmetra.png">Symmetra</option><option value="Torbjörn.png">Torbjörn</option><option value="Tracer.png">Tracer</option><option value="Vendetta.png">Vendetta</option><option value="Venture.png">Venture</option><option value="Vital.png">Vital</option><option value="Winston.png">Winston</option><option value="Wuyang.png">Wuyang</option><option value="Zarya.png">Zarya</option><option value="Zenyatta.png">Zenyatta</option></select>
<label for="role">Ton rôle</label><select id="role"><option value="TANK">TANK</option><option value="DPS">DPS</option><option value="SOUTIEN">SOUTIEN</option></select>
<div class="actions"><button id="show" class="primary">Afficher mon bandeau</button><button id="hide" class="secondary">Masquer</button></div>
<p id="status" class="status">Connexion en cours…</p>
</section><footer>CHROMA ESPORT <span>•</span> NEVER BACK DOWN</footer></main><script type="module" src="control.js?v=20261121hero"></script></body></html>
