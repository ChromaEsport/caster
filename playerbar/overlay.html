<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chroma Esport — Player ID</title>
  <link rel="stylesheet" href="overlay.css?v=20261121b">
</head>
<body>
  <main id="banner" class="banner" aria-hidden="true">
    <div class="frame"></div>
    <div class="ambient"></div>
    <div class="brand">
      <div class="brand-mark"><img src="../logo/chroma%20badge.png" alt="Chroma"></div>
      <div class="brand-copy"><span>CHROMA</span><strong>ESPORT</strong><small>OVERWATCH</small></div>
    </div>
    <div class="role-zone">
      <div class="role-orbit"><span class="orbit-dot"></span><img id="roleIcon" class="role-icon" src="../roles/damage.png" alt=""></div>
      <span id="roleLabel" class="role-label">DÉGÂTS</span>
    </div>
    <div id="heroArt" class="hero-art" hidden><img id="heroImage" src="" alt=""></div>
    <div class="identity">
      <span class="identity-kicker">PLAYER PROFILE <i></i> CHROMA OVERWATCH</span>
      <strong id="playerName" class="player-name"></strong>
    </div>
    <div class="swoosh swoosh-one"></div>
    <div class="swoosh swoosh-two"></div>
    <div class="light-pass"></div>
    <div class="end-cap"></div>
  </main>
  <script type="module" src="overlay.js?v=20261121b"></script>
</body>
</html>
