<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Chroma Control</title>
<link rel="stylesheet" href="control.css">
</head>

<body>
<div class="container">
<h1>CHROMA CONTROL PANEL</h1>

    <div class="layout">

    <div class="left-column">
<!-- CASTERS -->

<div class="team-card">

    <h2 class="section-title">
        🎙️ CASTERS
    </h2>

    <input
        id="casters"
        placeholder="pseudo caster(s)">

</div>


<hr>



<!-- EVENEMENT -->

<div class="team-card">

    <h2 class="section-title">
        🏆 ÉVÉNEMENT
    </h2>

    <input
        id="event"
        placeholder="FACEIT MATCH">

</div>
        
<hr>

<div class="team-card chroma-card">

    <h2 class="section-title">
ÉQUIPE 1
</h2>

    <input id="team1" placeholder="nom equipe 1">


    <div class="score-control">

        <button onclick="removeScore1()">−</button>

        <span id="score1">0</span>

        <button onclick="addScore1()">+</button>

    </div>

</div>


<hr>


<div class="team-card">

    <h2 class="section-title">
ÉQUIPE 2
</h2>

    <input id="team2" placeholder="nom equipe 2">


    <div class="score-control">

        <button onclick="removeScore2()">−</button>

        <span id="score2">0</span>

        <button onclick="addScore2()">+</button>

    </div>

</div>

<button class="send-button" onclick="sendMatch()">
ENVOYER
</button>
        
 </div>       

<div class="right-column">

<div class="ban-card">

    <h2 class="section-title">
        🚫 PICK & BAN
    </h2>

    <div class="pick-buttons">

<h3>MANCHE EN COURS</h3>
        
<button id="round1" class="round-btn" onclick="selectMap(1)">
MANCHE 1
</button>

<button id="round2" class="round-btn" onclick="selectMap(2)">
MANCHE 2
</button>

<button id="round3" class="round-btn" onclick="selectMap(3)">
MANCHE 3
</button>

<button id="round4" class="round-btn" onclick="selectMap(4)">
MANCHE 4
</button>

<button id="round5" class="round-btn" onclick="selectMap(5)">
MANCHE 5
</button>

<hr>        

<h3>CHOIX DE LA MAP</h3>

<select id="mapSelect">
    <option value="" disabled selected>
        Choisir Map
    </option>
</select>

<button onclick="sendMap()">
ENVOYER MAP
</button>      

<h3>BAN HEROES</h3>
        
<select id="heroSelect">
    <option value="" disabled selected>
        Choisir Heroes
    </option>
</select>

<button onclick="sendBan1()">
ENVOYER BAN 1
</button>

  <button onclick="sendBan2()">
    ENVOYER BAN 2
  </button>  

        <hr>

<button class="reset-btn" onclick="resetDraft()">
    RESET DRAFT
</button>    
        
    </div>
        
</div>
    

</div>

</div>

</div>
    
<script type="module" src="control.js"></script>

</div>
</body>

</html>
